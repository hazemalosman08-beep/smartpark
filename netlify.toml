# Netlify settings (used when the site is connected to a Git repo; a drag-and-drop
# upload of the built folder uses public/_redirects instead).
[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Built files and the model are named by version, so browsers may keep them.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
[[headers]]
  for = "/models/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
